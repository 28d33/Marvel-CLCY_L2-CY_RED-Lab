// m1 authoritative DNS for the ipvlab.lab lab domain (passive reccon playground).
// Authoritative-only (no recursion) so the lab cannot be used as an open resolver;
// AXFR is deliberately left open so zone transfers are a teaching point.
options {
  directory "/var/named";
  listen-on port 53 { 10.10.10.2; 127.0.0.1; };
  listen-on-v6 { none; };
  recursion no;
  allow-query { any; };
  allow-recursion { none; };
  pid-file "/run/named/named.pid";
  querylog yes;
};
zone "ipvlab.lab" IN {
  type master;
  file "ipvlab.lab.zone";
  allow-transfer { any; };   // intentionally permissive AXFR
};